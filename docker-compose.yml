services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: moysklad-didox:latest
    container_name: moysklad-didox
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8085
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8085/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
